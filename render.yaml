services:
  - type: web
    name: lc79-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k gthread --threads 50 -b 0.0.0.0:$PORT app:app
    disks:
      - name: lc79-data
        mountPath: /data
        sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: TELETHON_API_ID
        sync: false
      - key: TELETHON_API_HASH
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
